<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 背景漸層 (俐落現代藍) -->
    <linearGradient id="conan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <!-- 頭髮漸層 -->
    <linearGradient id="conan-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D323F"/>
      <stop offset="100%" stop-color="#14161D"/>
    </linearGradient>
    <clipPath id="conan-clip">
      <circle cx="24" cy="24" r="22.5"/>
    </clipPath>
  </defs>

  <!-- 圓形背景邊框 -->
  <circle cx="24" cy="24" r="22.5" fill="url(#conan-bg)" stroke="#93C5FD" stroke-width="1.2"/>

  <g clip-path="url(#conan-clip)">
    <!-- 原作特色後髮與呆毛 -->
    <!-- 右後方招牌尖銳呆毛 (青山剛昌標誌性翹髮) -->
    <path d="M31 14 Q38 10 42 4 C39 7 35 10 30 11 Z" fill="#14161D"/>
    <path d="M29 11 Q36 8 39 3 C36 6 32 8 28 9 Z" fill="#1E222D"/>
    <!-- 左側小翹髮 -->
    <path d="M16 13 Q10 10 7 5 C9 9 13 11 17 12 Z" fill="#14161D"/>

    <!-- 後髮輪廓 -->
    <path d="M10 20 C9 12 15 5 24 5 C33 5 39 12 38 20 C38 27 35 32 32 35 L16 35 C13 32 10 27 10 20 Z" fill="#14161D"/>

    <!-- 身體與衣服 (深藍西裝、白襯衫、立體紅色領結) -->
    <!-- 脖子與陰影 -->
    <polygon points="21,30 27,30 28,37 20,37" fill="#E8B595"/>
    <!-- 藍色西裝外套 -->
    <path d="M11 48 L12 40 C14 36 18 35 24 35 C30 35 34 36 36 40 L37 48 Z" fill="#1E3A8A"/>
    <!-- 西裝領口與白襯衫 -->
    <polygon points="19,35 24,42 29,35" fill="#FFFFFF"/>
    <path d="M17 36 L21 44 L15 48" stroke="#172554" stroke-width="1" fill="#1E3A8A"/>
    <path d="M31 36 L27 44 L33 48" stroke="#172554" stroke-width="1" fill="#1E3A8A"/>

    <!-- 經典紅色蝴蝶結變聲器 -->
    <path d="M24 38.5 L19 36 L19.5 41 Z" fill="#DC2626"/>
    <path d="M24 38.5 L29 36 L28.5 41 Z" fill="#DC2626"/>
    <path d="M20 37 L24 38.5 L20 40 Z" fill="#B91C1C"/>
    <path d="M28 37 L24 38.5 L28 40 Z" fill="#B91C1C"/>
    <circle cx="24" cy="38.5" r="1.5" fill="#EF4444"/>

    <!-- 耳朵 -->
    <path d="M12.5 21 C11 21 11 27 13.5 27" fill="#FCD3B6" stroke="#1E222D" stroke-width="0.8"/>
    <path d="M35.5 21 C37 21 37 27 34.5 27" fill="#FCD3B6" stroke="#1E222D" stroke-width="0.8"/>

    <!-- 原作俐落臉型 (尖下巴) -->
    <path d="M13.5 20 L14.5 26 L24 33.5 L33.5 26 L34.5 20 C34.5 13 30 11 24 11 C18 11 13.5 13 13.5 20 Z" fill="#FCD3B6"/>
    <!-- 臉部側邊與下巴陰影 -->
    <path d="M14.5 26 L24 33.5 L21 33.5 L13.8 25 Z" fill="#E8B595" opacity="0.6"/>

    <!-- 眼睛 (原作俐落神情) -->
    <!-- 左眼 -->
    <path d="M16.5 21.5 Q19 20.5 21.5 21.5" stroke="#14161D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M17.5 22 L17.5 24.5 Q19 26 20.5 24.5 L20.5 22 Z" fill="#1E3A8A"/>
    <circle cx="19" cy="23.2" r="1.1" fill="#0F172A"/>
    <circle cx="19.6" cy="22.5" r="0.7" fill="#FFFFFF"/>
    <!-- 右眼 -->
    <path d="M26.5 21.5 Q29 20.5 31.5 21.5" stroke="#14161D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M27.5 22 L27.5 24.5 Q29 26 30.5 24.5 L30.5 22 Z" fill="#1E3A8A"/>
    <circle cx="29" cy="23.2" r="1.1" fill="#0F172A"/>
    <circle cx="29.6" cy="22.5" r="0.7" fill="#FFFFFF"/>

    <!-- 俐落微翹眉毛 -->
    <path d="M16 18 Q19 16.8 21.5 18.2" stroke="#14161D" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M26.5 18.2 Q29 16.8 32 18" stroke="#14161D" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- 青山風格鼻影與自信嘴型 -->
    <polygon points="23.8,26.5 24.5,27.5 23.5,27.5" fill="#D99B77"/>
    <path d="M22.5 30 Q24 31.2 26 29.8" stroke="#881337" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- 前額瀏海 (青山剛昌原作銳利幾何瀏海) -->
    <path d="M10 19 C11 13 16 5 24 5 C32 5 37 13 38 19 C35 16 32 15 30 17 C28 13 25 14 23.5 18.5 C22 13 18 13 16 17.5 C14 15 11 16 10 19 Z" fill="url(#conan-hair)"/>
    <!-- 額頭垂下的銳角尖髮束 -->
    <polygon points="23,12 25,20 26.5,14" fill="#14161D"/>
    <polygon points="17.5,13 19.5,18.5 21,14" fill="#14161D"/>
    <polygon points="27.5,13 29,18 30.5,14" fill="#14161D"/>
    <!-- 瀏海投射在額頭上的陰影 -->
    <polygon points="23,19 25,20.8 26.5,19" fill="#E8B595" opacity="0.6"/>

    <!-- 柯南招牌黑框大眼鏡 (貼近原作方圓造型) -->
    <rect x="14" y="18" width="9.2" height="8.2" rx="1.6" fill="none" stroke="#111827" stroke-width="1.3"/>
    <rect x="24.8" y="18" width="9.2" height="8.2" rx="1.6" fill="none" stroke="#111827" stroke-width="1.3"/>
    <!-- 鏡橋與鏡腳 -->
    <path d="M23.2 21.8 L24.8 21.8" stroke="#111827" stroke-width="1.3"/>
    <path d="M14 21.5 L12 22" stroke="#111827" stroke-width="1.1"/>
    <path d="M34 21.5 L36 22" stroke="#111827" stroke-width="1.1"/>
    <!-- 原作鏡片白色銳角反光 -->
    <path d="M15 19.2 L18.5 19.2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M26 19.2 L29.5 19.2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
