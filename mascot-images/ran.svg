<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 背景漸層 (櫻花粉柔和背景) -->
    <linearGradient id="ran-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <!-- 深黑棕秀髮漸層 -->
    <linearGradient id="ran-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2820"/>
      <stop offset="100%" stop-color="#19100B"/>
    </linearGradient>
    <clipPath id="ran-clip">
      <circle cx="24" cy="24" r="22.5"/>
    </clipPath>
  </defs>

  <!-- 圓形背景邊框 -->
  <circle cx="24" cy="24" r="22.5" fill="url(#ran-bg)" stroke="#F472B6" stroke-width="1.2"/>

  <g clip-path="url(#ran-clip)">
    <!-- 標誌性「小蘭之角」(原作招牌幾何三角髮髻) -->
    <path d="M19 11 L22 0 L27 7.5 Z" fill="url(#ran-hair)"/>
    <path d="M20 9 L22 2 L25 7" stroke="#5E4032" stroke-width="0.8" fill="none"/>

    <!-- 長直披肩後髮 -->
    <path d="M8 20 C8 10 15 4 24 4 C33 4 40 10 40 20 C40 31 38 41 36 48 L12 48 C10 41 8 31 8 20 Z" fill="#19100B"/>
    <!-- 胸前兩側自然垂落的長黑髮 -->
    <path d="M10 24 C9 31 9 40 13 48 L16 48 C13 40 12 31 14 24 Z" fill="#291A12"/>
    <path d="M38 24 C39 31 39 40 35 48 L32 48 C35 40 36 31 34 24 Z" fill="#291A12"/>

    <!-- 帝丹高中制服 (正統水藍西裝外套 + 白襯衫 + 綠領帶) -->
    <!-- 脖子與下巴陰影 -->
    <polygon points="21,29 27,29 28,36 20,36" fill="#ECC5AF"/>
    <!-- 西裝外套 -->
    <path d="M11 48 L12 40 C14 36 18 35 24 35 C30 35 34 36 36 40 L37 48 Z" fill="#2563EB"/>
    <!-- 白襯衫領片 -->
    <polygon points="19,35 24,43 29,35" fill="#FFFFFF"/>
    <!-- 綠色領帶 (帝丹高二標準綠領帶) -->
    <polygon points="23,37 25,37 26,46 24,48 22,46" fill="#10B981"/>
    <polygon points="22.5,36 25.5,36 24.5,38 23.5,38" fill="#059669"/>
    <!-- 外套領子輪廓 -->
    <path d="M17 36 L21 44 L15 48" stroke="#1D4ED8" stroke-width="0.9" fill="#2563EB"/>
    <path d="M31 36 L27 44 L33 48" stroke="#1D4ED8" stroke-width="0.9" fill="#2563EB"/>

    <!-- 原作秀氣耳朵 -->
    <path d="M13 22 C11.5 22 11.5 27 13.5 27" fill="#FEE3D2" stroke="#291A12" stroke-width="0.7"/>
    <path d="M35 22 C36.5 22 36.5 27 34.5 27" fill="#FEE3D2" stroke="#291A12" stroke-width="0.7"/>

    <!-- 原作女主角瓜子臉型 (尖下巴) -->
    <path d="M14 20 L15 26 L24 33 L33 26 L34 20 C34 13.5 30 11 24 11 C18 11 14 13.5 14 20 Z" fill="#FEE3D2"/>
    <!-- 側臉與頸部陰影 -->
    <polygon points="21,31 24,33 27,31 24,32" fill="#ECC5AF"/>

    <!-- 小蘭經典清澈明眸 (深藍/紫藍大眼，帶雙眼皮線與細緻睫毛) -->
    <!-- 左眼 -->
    <path d="M15.5 20.8 Q18.5 19 21.5 20.5" stroke="#19100B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M15.2 21.2 L14.2 20.2" stroke="#19100B" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 雙眼皮線 -->
    <path d="M16 19.5 Q18.5 18.2 21 19.2" stroke="#8A5A44" stroke-width="0.6" fill="none"/>
    <!-- 左瞳孔 -->
    <path d="M16.8 21.5 L16.8 24.5 Q18.5 26 20.2 24.5 L20.2 21.5 Z" fill="#4338CA"/>
    <circle cx="18.5" cy="23.2" r="1.1" fill="#1E1B4B"/>
    <circle cx="19.2" cy="22.2" r="0.7" fill="#FFFFFF"/>
    <circle cx="17.6" cy="24.2" r="0.4" fill="#818CF8"/>

    <!-- 右眼 -->
    <path d="M26.5 20.5 Q29.5 19 32.5 20.8" stroke="#19100B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M32.8 21.2 L33.8 20.2" stroke="#19100B" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 雙眼皮線 -->
    <path d="M27 19.2 Q29.5 18.2 32 19.5" stroke="#8A5A44" stroke-width="0.6" fill="none"/>
    <!-- 右瞳孔 -->
    <path d="M27.8 21.5 L27.8 24.5 Q29.5 26 31.2 24.5 L31.2 21.5 Z" fill="#4338CA"/>
    <circle cx="29.5" cy="23.2" r="1.1" fill="#1E1B4B"/>
    <circle cx="30.2" cy="22.2" r="0.7" fill="#FFFFFF"/>
    <circle cx="28.6" cy="24.2" r="0.4" fill="#818CF8"/>

    <!-- 溫柔女角細眉 -->
    <path d="M16 17 Q18.5 15.8 21 17" stroke="#3A2820" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M27 17 Q29.5 15.8 32 17" stroke="#3A2820" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- 原作精緻鼻點與甜美微笑 -->
    <circle cx="24" cy="26.8" r="0.5" fill="#D2997C"/>
    <path d="M22.2 29.5 Q24 31.2 25.8 29.5" stroke="#BE123C" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- 前髮 (柔順分邊瀏海，與招牌尖角自然銜接) -->
    <path d="M9 21 C9 12 15 4 24 4 C33 4 39 12 39 21 C37 16 34 15 31 16 C27 12 22 12 18 15 C14 13 11 17 9 21 Z" fill="url(#ran-hair)"/>
    <!-- 額前順滑的幾綹瀏海 -->
    <polygon points="14,15 16,21 17.5,16" fill="#19100B"/>
    <polygon points="18,14 20.5,21.5 22.5,15" fill="#19100B"/>
    <polygon points="25.5,15 27.5,21.5 30,14" fill="#19100B"/>

    <!-- 臉頰側邊鬢髮修飾 -->
    <path d="M11 19 C10 23 11 27 13.5 30 C12.5 26 12.5 22 13.5 19 Z" fill="#291A12"/>
    <path d="M37 19 C38 23 37 27 34.5 30 C35.5 26 35.5 22 34.5 19 Z" fill="#291A12"/>
  </g>
</svg>
