<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 背景漸層 (冷調知性淡紫) -->
    <linearGradient id="haibara-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <!-- 原作茶褐色捲髮漸層 -->
    <linearGradient id="haibara-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C624B"/>
      <stop offset="100%" stop-color="#693B2B"/>
    </linearGradient>
    <clipPath id="haibara-clip">
      <circle cx="24" cy="24" r="22.5"/>
    </clipPath>
  </defs>

  <!-- 圓形背景邊框 -->
  <circle cx="24" cy="24" r="22.5" fill="url(#haibara-bg)" stroke="#C084FC" stroke-width="1.2"/>

  <g clip-path="url(#haibara-clip)">
    <!-- 原作後髮基底 (波浪短髮後側) -->
    <path d="M9 22 C9 11 15 5 24 5 C33 5 39 11 39 22 C39 28 37 34 34 36 L14 36 C11 34 9 28 9 22 Z" fill="#582F22"/>
    <!-- 兩側向外微翹的波浪髮尾 -->
    <path d="M8 26 C6 30 8 35 12 35 C10 33 9 30 10 27 Z" fill="#582F22"/>
    <path d="M40 26 C42 30 40 35 36 35 C38 33 39 30 38 27 Z" fill="#582F22"/>

    <!-- 身體與服裝 (經典酒紅高領 + 白袍/外套) -->
    <!-- 脖子與陰影 -->
    <polygon points="21,29 27,29 28,36 20,36" fill="#ECC3AB"/>
    <!-- 酒紅色高領領口 -->
    <rect x="20" y="32" width="8" height="4.5" rx="1" fill="#881337"/>
    <line x1="20" y1="34" x2="28" y2="34" stroke="#700F2D" stroke-width="0.7"/>
    <!-- 外套/身軀 -->
    <path d="M12 48 L13 40 C15 36 18 35 24 35 C30 35 33 36 35 40 L36 48 Z" fill="#9F1239"/>
    <!-- 白實驗袍領片 (增添原作成熟冷酷氣質) -->
    <polygon points="17,37 21,48 14,48" fill="#F1F5F9"/>
    <polygon points="31,37 27,48 34,48" fill="#F1F5F9"/>

    <!-- 原作小巧耳型 -->
    <path d="M13 22 C11.5 22 11.5 27 13.5 27" fill="#FEE5D7" stroke="#582F22" stroke-width="0.7"/>
    <path d="M35 22 C36.5 22 36.5 27 34.5 27" fill="#FEE5D7" stroke="#582F22" stroke-width="0.7"/>

    <!-- 原作細緻尖下巴臉型 -->
    <path d="M14 20 L15 26 L24 33 L33 26 L34 20 C34 13.5 30 11 24 11 C18 11 14 13.5 14 20 Z" fill="#FEE5D7"/>
    <!-- 下巴陰影 -->
    <polygon points="21,31 24,33 27,31 24,32" fill="#ECC3AB"/>

    <!-- 灰原哀標誌性冷靜/微垂半睜鳳眼 (湖水綠/碧藍眸) -->
    <!-- 左眼 -->
    <path d="M16 21.8 Q19 20.2 21.8 21.8" stroke="#18181B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M15.8 22.3 L15 23.2" stroke="#18181B" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M17 22.5 L17 24.8 Q19 26 20.8 24.8 L20.8 22.5 Z" fill="#0D9488"/>
    <circle cx="19" cy="23.8" r="1.1" fill="#134E4A"/>
    <circle cx="19.5" cy="23" r="0.6" fill="#FFFFFF"/>
    <path d="M17.2 25.5 Q19 26.2 20.8 25.5" stroke="#18181B" stroke-width="0.6" fill="none"/>

    <!-- 右眼 -->
    <path d="M26.2 21.8 Q29 20.2 32 21.8" stroke="#18181B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M32.2 22.3 L33 23.2" stroke="#18181B" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M27.2 22.5 L27.2 24.8 Q29 26 31 24.8 L31 22.5 Z" fill="#0D9488"/>
    <circle cx="29" cy="23.8" r="1.1" fill="#134E4A"/>
    <circle cx="29.5" cy="23" r="0.6" fill="#FFFFFF"/>
    <path d="M27.2 25.5 Q29 26.2 30.8 25.5" stroke="#18181B" stroke-width="0.6" fill="none"/>

    <!-- 細長冷靜眉毛 -->
    <path d="M16.5 18 Q19 17.5 21.5 18.5" stroke="#693B2B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M26.5 18.5 Q29 17.5 31.5 18" stroke="#693B2B" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- 原作細膩鼻點與優雅冷靜微抿嘴角 -->
    <circle cx="24" cy="27" r="0.5" fill="#D2997C"/>
    <path d="M22.5 30 Q24 30.7 25.5 30" stroke="#9F1239" stroke-width="0.85" stroke-linecap="round" fill="none"/>

    <!-- 灰原標誌性前髮：波浪分邊弧形長短瀏海 -->
    <path d="M9 21 C9 12 15 5 24 5 C33 5 39 12 39 21 C37 16 34 15 31 16 C28 13 25 13 23 16 C20 13 15 14 12 18 C10 17 9 19 9 21 Z" fill="url(#haibara-hair)"/>
    
    <!-- 左側大波浪外卷髮流 (原作經典弧度) -->
    <path d="M11 20 C10 24 10 29 14 33 C12.5 29 12.5 25 15.5 21 Z" fill="url(#haibara-hair)"/>
    <path d="M13 21 C12 25 13 29 16 31 C15 27 15 23 18 20 Z" fill="#804835"/>

    <!-- 右側分邊順勢外翹波浪髮流 -->
    <path d="M37 20 C38 24 38 29 34 33 C35.5 29 35.5 25 32.5 21 Z" fill="url(#haibara-hair)"/>
    <path d="M35 21 C36 25 35 29 32 31 C33 27 33 23 30 20 Z" fill="#804835"/>

    <!-- 額頭右偏分碎瀏海 -->
    <polygon points="21,12 23,19 24,14" fill="#693B2B"/>
    <polygon points="24,12 26,19.5 27.5,14" fill="#693B2B"/>
    <polygon points="27.5,13 29,18 30.5,14" fill="#693B2B"/>

    <!-- 髮絲頂部高光光澤圈 -->
    <path d="M15 11 Q24 7 33 11" stroke="#DEAA93" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
