<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 背景漸層 (金黃陽光琥珀色) -->
    <linearGradient id="amuro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <!-- 淺金/小麥金髮色漸層 -->
    <linearGradient id="amuro-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <clipPath id="amuro-clip">
      <circle cx="24" cy="24" r="22.5"/>
    </clipPath>
  </defs>

  <!-- 圓形背景邊框 -->
  <circle cx="24" cy="24" r="22.5" fill="url(#amuro-bg)" stroke="#F59E0B" stroke-width="1.2"/>

  <g clip-path="url(#amuro-clip)">
    <!-- 原作後髮層次與蓬鬆碎髮 -->
    <!-- 左側層次髮尾 -->
    <path d="M12 14 C7 11 5 16 6 22 C4 18 5 13 10 11 Z" fill="#B45309"/>
    <!-- 右側層次髮尾 -->
    <path d="M36 14 C41 11 43 16 42 22 C44 18 43 13 38 11 Z" fill="#B45309"/>
    <!-- 後髮主輪廓 -->
    <path d="M9 20 C9 11 15 4 24 4 C33 4 39 11 39 20 C39 27 36 33 33 35 L15 35 C12 33 9 27 9 20 Z" fill="#B45309"/>

    <!-- 身體與服裝 (深灰西裝外套 + 黑色內搭高領) -->
    <!-- 脖子 (健康小麥色肌膚 + 陰影) -->
    <polygon points="20.5,29 27.5,29 28.5,36 19.5,36" fill="#BA7D4E"/>
    <!-- 深灰夾克外套 -->
    <path d="M11 48 L12 40 C14 36 18 35 24 35 C30 35 34 36 36 40 L37 48 Z" fill="#334155"/>
    <!-- 黑色高領領口 -->
    <polygon points="19,35 24,42 29,35" fill="#0F172A"/>
    <rect x="21" y="32.5" width="6" height="3" rx="0.8" fill="#0F172A"/>
    <!-- 外套俐落立體剪裁 -->
    <path d="M16 36 L21 44 L14 48" stroke="#1E293B" stroke-width="1" fill="#334155"/>
    <path d="M32 36 L27 44 L34 48" stroke="#1E293B" stroke-width="1" fill="#334155"/>

    <!-- 耳朵 (小麥色 + 暗色輪廓) -->
    <path d="M12.5 21 C11 21 11 27 13.5 27" fill="#D99B68" stroke="#9A5B2C" stroke-width="0.7"/>
    <path d="M35.5 21 C37 21 37 27 34.5 27" fill="#D99B68" stroke="#9A5B2C" stroke-width="0.7"/>

    <!-- 原作男性俐落俊朗臉型 (銳利下巴與頜線) -->
    <path d="M13.5 19.5 L14.5 26 L24 33.5 L33.5 26 L34.5 19.5 C34.5 13 30 10.5 24 10.5 C18 10.5 13.5 13 13.5 19.5 Z" fill="#D99B68"/>
    <!-- 側臉立體陰影 -->
    <polygon points="21,31.5 24,33.5 27,31.5 24,32.5" fill="#BA7D4E"/>

    <!-- 安室透帥氣俐落雙眸 (灰藍色 / 銳利英挺眼神) -->
    <!-- 左眼 -->
    <path d="M16 21 Q19 19.5 22 20.8" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M17.2 21.5 L17.2 24.2 Q19 25.5 20.8 24.2 L20.8 21.5 Z" fill="#475569"/>
    <circle cx="19" cy="23" r="1.1" fill="#1E293B"/>
    <circle cx="19.6" cy="22.2" r="0.6" fill="#FFFFFF"/>
    <path d="M17.5 25 Q19 25.6 20.5 25" stroke="#0F172A" stroke-width="0.6" fill="none"/>

    <!-- 右眼 -->
    <path d="M26 20.8 Q29 19.5 32 21" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M27.2 21.5 L27.2 24.2 Q29 25.5 30.8 24.2 L30.8 21.5 Z" fill="#475569"/>
    <circle cx="29" cy="23" r="1.1" fill="#1E293B"/>
    <circle cx="29.6" cy="22.2" r="0.6" fill="#FFFFFF"/>
    <path d="M27.5 25 Q29 25.6 30.5 25" stroke="#0F172A" stroke-width="0.6" fill="none"/>

    <!-- 英氣金褐劍眉 -->
    <path d="M15.5 17.5 Q18.5 16 21.5 17" stroke="#A16207" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M26.5 17 Q29.5 16 32.5 17.5" stroke="#A16207" stroke-width="1" stroke-linecap="round" fill="none"/>

    <!-- 青山風格英挺鼻樑與自信笑容 -->
    <polygon points="23.8,26.5 24.5,27.5 23.5,27.5" fill="#A46435"/>
    <path d="M22.2 29.8 Q24 31.8 26.2 29.5" stroke="#7C2D12" stroke-width="1" stroke-linecap="round" fill="none"/>

    <!-- 前額髮 (安室透招牌金黃碎瀏海與層次) -->
    <path d="M9 20 C9 11 15 4 24 4 C33 4 39 11 39 20 C37 15 34 14 31 15 C27 11 21 11 17 15 C14 13 11 16 9 20 Z" fill="url(#amuro-hair)"/>
    
    <!-- 額頭垂下的俐落幾何尖瀏海束 -->
    <polygon points="13,14 15.5,21 17.5,15" fill="#EAB308"/>
    <polygon points="17,13 19.5,20.5 21.5,14" fill="#FACC15"/>
    <polygon points="20.5,12 23.5,21.5 25.5,13.5" fill="#FEF08A"/>
    <polygon points="25,13 27.5,20 29.5,14" fill="#FACC15"/>
    <polygon points="29,14 31.5,20.5 33.5,15" fill="#EAB308"/>

    <!-- 兩側修飾鬢角 -->
    <path d="M12 18 C11 22 12 25 14 27 C13 24 13 21 14 18 Z" fill="#CA8A04"/>
    <path d="M36 18 C37 22 36 25 34 27 C35 24 35 21 34 18 Z" fill="#CA8A04"/>

    <!-- 金髮天使光環高光圈 -->
    <path d="M15 10 Q24 6 33 10" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
